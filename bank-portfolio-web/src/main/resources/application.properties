spring.application.name=bank-portfolio-web

# client
spring.ai.mcp.client.name=bank-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.bank-server.url=http://localhost:8081


# Configuration Groq
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.replay-reasoning-content=false